<title>Therapia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-shaped column. Homepage > name > dashboard with bottom tabs (Home, Groups, Therapy, Library, Tools) > live room. The Ankara/Adire dot pattern is the single bold element; everything else stays calm. */
:root{
  --font-display:'Bricolage Grotesque','Avenir Next','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  /* adire indigo, zobo red, marigold, Naija green */
  --bg:#F6F4FB; --surface:#FFFFFF; --surface2:#EEEAF8; --ink:#1D1640; --muted:#625B83; --line:#E0DAF0;
  --accent:#2B2178; --on-accent:#FFFFFF; --focus:#5B4BE0;
  --indigo:#2B2178; --plum:#4B1D7A; --sun:#F4B52B; --hib:#C4244C; --green:#0E8A55; --live:#D81E4A;
  --on-sun:#1D1640; --white:#FFFFFF;
  --av1:#2B2178; --av2:#B52048; --av3:#0B7A4B; --av4:#A8630A; --av5:#6E37B0; --av6:#0A6F94;
  --m0:#F0668A; --m1:#F59A4B; --m2:#F4C84B; --m3:#8FD16B; --m4:#43C48A; --face:#1D1640;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120D29; --surface:#1C1540; --surface2:#271E55; --ink:#F2EFFB; --muted:#A8A0C9; --line:#34296A;
    --accent:#F4B52B; --on-accent:#1A1233; --focus:#F4B52B;
    --indigo:#3A2D9C; --hib:#FF6F8E; --green:#3DD598; --live:#FF5C7F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120D29; --surface:#1C1540; --surface2:#271E55; --ink:#F2EFFB; --muted:#A8A0C9; --line:#34296A;
  --accent:#F4B52B; --on-accent:#1A1233; --focus:#F4B52B;
  --indigo:#3A2D9C; --hib:#FF6F8E; --green:#3DD598; --live:#FF5C7F;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;
}
h1,h2,h3,p,ol,ul{margin:0}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.display{font-family:var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ico{flex:none}

/* Ankara-style pattern, parametrised by --u (tile size) and --p1..--p3 / --pat-bg */
.ankara{
  --u:44px;
  background-color:var(--pat-bg,var(--indigo));
  background-size:var(--u) var(--u);
  background-image:
    radial-gradient(circle at 50% 50%,var(--p1,var(--sun)) 0 calc(var(--u)*.11),transparent calc(var(--u)*.12)),
    radial-gradient(circle at 50% 50%,transparent 0 calc(var(--u)*.25),var(--p2,var(--hib)) calc(var(--u)*.26) calc(var(--u)*.31),transparent calc(var(--u)*.32)),
    radial-gradient(circle at 0 0,var(--p3,var(--green)) 0 calc(var(--u)*.16),transparent calc(var(--u)*.17)),
    radial-gradient(circle at 100% 0,var(--p3,var(--green)) 0 calc(var(--u)*.16),transparent calc(var(--u)*.17)),
    radial-gradient(circle at 0 100%,var(--p3,var(--green)) 0 calc(var(--u)*.16),transparent calc(var(--u)*.17)),
    radial-gradient(circle at 100% 100%,var(--p3,var(--green)) 0 calc(var(--u)*.16),transparent calc(var(--u)*.17));
}
.pal-a{--pat-bg:var(--indigo);--p1:var(--sun);--p2:var(--hib);--p3:var(--green)}
.pal-b{--pat-bg:var(--hib);--p1:var(--sun);--p2:var(--white);--p3:var(--plum)}
.pal-c{--pat-bg:var(--green);--p1:var(--sun);--p2:var(--white);--p3:var(--indigo)}
.pal-d{--pat-bg:var(--sun);--p1:var(--indigo);--p2:var(--hib);--p3:var(--white)}
.pal-e{--pat-bg:var(--plum);--p1:var(--sun);--p2:var(--green);--p3:var(--white)}

.backdrop{display:none;position:fixed;inset:0;z-index:0;opacity:.13;--u:64px}

/* Shell */
.shell{position:relative;z-index:1;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--bg);--pad:0px}
@media (min-width:720px){
  body{padding-block:24px;align-items:center}
  .backdrop{display:block}
  .shell{--pad:20px;max-height:860px;border-radius:32px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(10,5,40,.6),0 0 0 1px var(--line)}
}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px var(--pad) 28px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.screen>*{flex:none}

/* Bottom navigation and quick-exit bar */
.nav{display:flex;gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px}
@media (min-width:720px){.nav{padding-inline:12px}}
.nav button{flex:1;min-width:0;display:grid;justify-items:center;gap:2px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;padding:4px 2px;min-height:52px;border-radius:14px;cursor:pointer}
.nav .nv{width:46px;height:28px;border-radius:14px;display:grid;place-items:center}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .nv{background:var(--sun);color:var(--on-sun)}
.qxbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px 6px calc(var(--pad) + 4px);font-size:13px;font-weight:600;background:color-mix(in srgb,var(--hib) 14%,var(--surface))}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid transparent;background:transparent;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.sm{min-height:38px;padding:7px 14px;font-size:14px}
.btn.big{width:100%;min-height:52px;font-size:16px}
.btn.wide{width:100%;justify-content:flex-start}
.btn.icon{padding:0;width:44px;flex:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.accent{background:var(--sun);color:var(--on-sun)}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.soft.on{background:color-mix(in srgb,var(--green) 18%,var(--surface));color:var(--ink)}
.btn:active{transform:translateY(1px)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.pill-help{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:0;cursor:pointer;font-weight:700;font-size:13px;color:var(--hib);background:color-mix(in srgb,var(--hib) 13%,var(--surface));flex:none}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:7px 13px;min-height:34px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.field{flex:1;min-width:0;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 16px;min-height:44px}
.field::placeholder{color:var(--muted)}
.field.area{display:block;width:100%;border-radius:18px;min-height:120px;resize:vertical;line-height:1.5}
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:calc(var(--s)*.38);flex:none;letter-spacing:.02em}
.av.empty{background:transparent;border:2px dashed var(--line);color:var(--muted);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--ink)}
.badge.hib{background:color-mix(in srgb,var(--hib) 14%,var(--surface));color:var(--hib)}
.livepill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--live);background:color-mix(in srgb,var(--live) 13%,transparent);padding:3px 9px;border-radius:999px}
.livepill i{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.6s ease-in-out infinite}
.fine{font-size:12px;color:var(--muted);text-wrap:pretty}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.sec{display:grid;gap:10px}
.sec-h{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.empty{color:var(--muted);text-align:center;padding:18px 0}

/* Homepage */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark{font-size:26px;font-weight:800;letter-spacing:-.03em;display:inline-flex;align-items:center;gap:6px}
.wordmark::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--sun);margin-top:6px}
.tag{font-size:clamp(28px,8.2vw,38px);line-height:1.06;font-weight:800;letter-spacing:-.03em}
.hero{height:140px;border-radius:26px}
.namecard{margin:-46px 12px 0;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 14px 30px -20px rgba(20,10,70,.55)}
.namecard .nc-text{flex:1;min-width:140px}
.handle{font-size:23px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.assure{list-style:none;padding:0;display:grid;gap:10px}
.assure li{display:flex;align-items:center;gap:12px;font-weight:500}
.ic{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.steps{list-style:none;padding:0;display:grid;gap:12px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps .sn{width:34px;height:34px;border-radius:50%;background:var(--sun);color:var(--on-sun);font-family:var(--font-display);font-weight:800;display:grid;place-items:center;flex:none}
.steps b{display:block}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topic{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.topic .dot{--u:14px;width:28px;height:28px;border-radius:50%}
.more{display:grid;gap:12px}
.more li{list-style:none;display:flex;gap:12px;align-items:flex-start}
.more b{display:block}
.band{border-radius:26px;padding:20px;display:grid;gap:12px;background:var(--surface);border:1px solid var(--line)}

/* Dashboard, page heads */
.home-top{display:flex;align-items:center;gap:12px}
.home-top .who{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.hello{font-size:21px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ptitle{font-size:30px;font-weight:800;line-height:1.05}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{display:grid;justify-items:center;gap:6px;padding:10px 2px 8px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:12px;font-weight:700;min-width:0}
.mood[aria-pressed="true"]{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 18%,var(--surface))}
.mood svg{display:block}
.mood-resp{display:grid;gap:10px;background:var(--surface2);border-radius:16px;padding:12px 14px}
.act-btns{display:flex;gap:8px;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:92px}
.wd{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.wd .bar{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;min-height:6px}
.wd .bar.none{background:transparent;border:1.5px dashed var(--line)}
.wd .dl{font-size:11px;font-weight:700;color:var(--muted)}
.toolgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.toolcard{display:grid;gap:4px;justify-items:start;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;cursor:pointer;min-height:116px}
.toolcard .ic{width:40px;height:40px;border-radius:14px;margin-bottom:6px}
.toolcard b{font-size:17px;font-weight:800}
.toolcard .muted{font-size:13px}
.affirm{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.affirm .strip{height:26px;--u:26px}
.affirm .body{padding:16px;display:grid;gap:12px;justify-items:start}
.quote{font-size:22px;font-weight:800;line-height:1.15}
.promo{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px 14px;align-items:start}
.promo .tile{--u:28px;width:56px;height:56px;border-radius:16px;grid-row:1/3}
.promo h3{font-size:18px;font-weight:800;line-height:1.15}
.promo .act{grid-column:2}

/* Cards: rooms, library */
.rcard{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.rcard .tile{--u:28px;width:56px;height:56px;border-radius:16px;grid-row:1/3}
.rc-cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.rcard h3{font-size:18px;font-weight:800;line-height:1.15;margin-top:2px}
.rc-host{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);margin-top:3px}
.rc-host .ico{color:var(--green)}
.rc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.rc-meta .when{font-weight:700}
.rc-act{grid-column:2;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.blurb{font-size:14px;color:var(--muted);margin-top:4px}

/* Therapy */
.tcard{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.tcard h3{font-size:18px;font-weight:800;line-height:1.15}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tagc{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface2)}
.tc-foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.tc-foot .price{font-weight:800}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.booked{display:flex;align-items:center;gap:12px}

/* Tools */
.breath{display:grid;justify-items:center;gap:16px;padding:12px 0}
.br-wrap{width:240px;max-width:100%;aspect-ratio:1;display:grid;place-items:center;position:relative}
.br-circle{position:absolute;inset:0;border-radius:50%;background:var(--accent);transform:scale(.55);transition:transform 4s ease-in-out;box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 18%,transparent)}
.br-text{position:relative;text-align:center;color:var(--on-accent);display:grid;gap:2px}
.br-text b{font-family:var(--font-display);font-size:20px;font-weight:800}
.br-text span{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.ground{display:grid;justify-items:center;gap:12px;text-align:center;padding:8px 0}
.gnum{font-family:var(--font-display);font-size:96px;font-weight:800;line-height:1;color:var(--accent)}
.gl{font-family:var(--font-display);font-size:24px;font-weight:800}
.pdots{display:flex;gap:8px}
.pdots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.pdots i.on{background:var(--sun)}
.entry{display:grid;gap:6px}
.entry p{white-space:pre-wrap;overflow-wrap:anywhere}
.entry-h{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Lobby */
.lobby{display:grid;gap:16px;justify-items:center;text-align:center;padding-top:30px}
.lobby .hero{width:100%;height:110px}
.lobby h2{font-size:26px;font-weight:800;line-height:1.1}
.lobby p{max-width:34ch;text-wrap:pretty}
.dots{display:flex;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--sun);animation:bounce 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}

/* Room */
.rmscreen{position:relative;overflow:hidden;gap:10px;padding-bottom:10px}
.rm-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rm-meta{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.rm-title h2{font-size:21px;font-weight:800;line-height:1.1}
.rm-sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
.hostbar{display:grid;gap:8px;background:color-mix(in srgb,var(--sun) 20%,var(--surface));border-radius:16px;padding:10px 12px}
.hb-row{display:flex;gap:8px;flex-wrap:wrap}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;gap:18px}
.member{display:grid;justify-items:center;gap:4px;text-align:center;min-width:0}
.member .nm{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member.host{display:flex;align-items:center;gap:16px;text-align:left;justify-items:start;padding:8px 8px 0}
.member.host .host-txt{display:grid;gap:2px;min-width:0}
.member.host .nm{font-size:17px;font-family:var(--font-display);font-weight:800}
.role{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.role .ico{color:var(--green)}
.guests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.eq{display:none;align-items:flex-end;gap:2px;height:12px}
.eq i{width:3px;background:var(--green);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}
.eq i:nth-child(3){animation-delay:.4s}
.member.speaking .eq{display:inline-flex}
.member.speaking .av{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--green);animation:ring 1.4s ease-in-out infinite}
.stage-foot{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.stack{display:inline-flex}
.stack .av{margin-left:-7px;box-shadow:0 0 0 2px var(--surface);font-size:0}
.stack .av:first-child{margin-left:0}
.sim{margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.tabs{display:flex;gap:6px}
.tab{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.tab[aria-selected="true"]{background:var(--surface2);color:var(--ink)}
.count{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--sun);color:var(--on-sun);font-size:12px;display:inline-grid;place-items:center}
.panel{flex:1 1 auto;min-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px 0}
.msg{display:flex;gap:10px;align-items:flex-start}
.bub{min-width:0}
.bub .who{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.bub p{background:var(--surface2);padding:8px 12px;border-radius:4px 16px 16px 16px;margin-top:3px;overflow-wrap:anywhere}

function applyPhase(p){
  var names=['Breathe in','Hold','Breathe out','Hold'];var scales=[1,1,0.55,0.55];
  var c=$('#br-circle');if(!c)return;
  c.style.transitionDuration=(p===0||p===2)?'4s':'0s';c.style.transform='scale('+scales[p]+')';
  $('#br-text').textContent=names[p];
}
function breathStop(finished){
  clearInterval(state.breathTimer);state.breathTimer=null;state.breath=null;
  var c=$('#br-circle');if(!c)return;
  c.style.transitionDuration='0s';c.style.transform='scale(.55)';
  $('#br-text').textContent=finished?'Well done':'Ready';$('#br-sec').textContent='';$('#br-left').textContent='1:00';$('#br-btn').textContent='Start';
  if(finished){toast('Well done. That was one minute.');}
}
function breathStart(){
  var c=$('#br-circle');c.style.transitionDuration='0s';c.style.transform='scale(.55)';void c.offsetWidth;
  state.breath={t:0};applyPhase(0);$('#br-sec').textContent='4';$('#br-btn').textContent='Stop';
  state.breathTimer=setInterval(function(){
    var b=state.breath;if(!b)return;
    b.t++;
    if(b.t>=60){breathStop(true);return;}
    if(b.t%4===0){applyPhase(Math.floor(b.t/4)%4);}
    $('#br-sec').textContent=String(4-(b.t%4));
    var left=60-b.t;$('#br-left').textContent='0:'+String(left).padStart(2,'0');
  },1000);
}

    '<div class="panel" id="rm-chat" role="log"></div><div class="panel" id="rm-hands" hidden></div>'+
    '<div class="dock"><div class="actions" id="dk-actions"></div>'+
    '<form class="chatform" id="chat-form"><input id="chat-in" class="field" type="text" maxlength="240" placeholder="'+esc(t('ph'))+'" autocomplete="off" aria-label="Message">'+
    '<button class="btn primary icon" type="submit" aria-label="Send">'+ico('send')+'</button></form></div>';
}
function paintSpeaking(){
  var st=$('#rm-stage');if(!st)return;
  $$('[data-m]',st).forEach(function(n){var m=n.getAttribute('data-m');var on=(m==='me')?!state.muted:(m===state.speaker);n.classList.toggle('speaking',on);});
}
function renderStage(){
  var r=state.room;
  function slot(i){
    var g=state.guests[i];
    if(!g){return '<div class="member"><span class="av empty" style="--s:48px" aria-hidden="true">+</span><span class="nm">Open slot</span></div>';}
    var nm=g.me?'You':g.h;
    return '<div class="member" data-m="'+(g.me?'me':esc(g.h))+'">'+avatar(g.h,48)+'<span class="nm">'+esc(nm)+'</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></div>';
  }
  $('#rm-stage').innerHTML=
    '<div class="member host" data-m="'+esc(r.host)+'">'+avatar(r.host,64)+'<div class="host-txt"><span class="nm">'+esc(r.host)+'</span><span class="role">'+ico('check',14)+' Host · verified facilitator</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></div></div>'+
    '<div class="guests">'+[0,1,2].map(slot).join('')+'</div>'+
    '<div class="stage-foot"><span class="stack">'+PEOPLE.slice(0,5).map(function(p){return avatar(p,24);}).join('')+'</span><span><b id="rm-count">'+state.count+'</b> '+t('listening')+'</span><span class="sim">Audio simulated</span></div>';
  paintSpeaking();
}
function renderDock(){
  var onStage=state.guests.some(function(g){return g.me;});
  var r=state.room;
  var reacts='<div class="reacts">'+
    '<button class="react" data-action="react" data-e="💛" aria-label="Send love">💛</button>'+
    '<button class="react" data-action="react" data-e="👏" aria-label="Clap">👏</button>'+
    '<button class="react" data-action="react" data-e="🙋" aria-label="Me too">🙋</button></div>';
  var btns;
  if(onStage){
    btns='<div class="act-btns"><button class="btn '+(state.muted?'soft':'accent')+'" data-action="mic" aria-pressed="'+(!state.muted)+'">'+ico(state.muted?'micoff':'mic',18)+' '+(state.muted?t('muted'):t('mic'))+'</button>'+
      '<button class="btn ghost" data-action="step">'+t('step')+'</button></div>';
  }else if(state.hand){
    btns='<div class="act-btns"><button class="btn soft on" data-action="lower">'+ico('hand',18)+' '+t('lower')+'</button></div>';
  }else{
    btns='<div class="act-btns"><button class="btn accent" data-action="raise">'+ico('hand',18)+' '+t('raise')+'</button></div>';
  }
  var dis='';
  if(onStage){
    if(r.women){dis='<p class="dis-note">Voice disguise is off in this room.</p>';}
    else{dis='<div class="dis"><span class="eyebrow">Voice disguise</span><div class="seg" role="group" aria-label="Voice disguise">'+
      ['Off','Soft','Deep'].map(function(v){return '<button data-action="disguise" data-v="'+v+'" aria-pressed="'+(state.disguise===v)+'">'+v+'</button>';}).join('')+'</div></div>';}
  }
  $('#dk-actions').innerHTML=dis+'<div class="act-row">'+reacts+btns+'</div>';
}
function renderHands(){
  var box=$('#rm-hands');if(!box)return;
  $('#tab-hands-n').textContent=state.hands.length;
  if(!state.hands.length){box.innerHTML='<p class="empty">No hands up right now.</p>';return;}
  box.innerHTML=state.hands.map(function(h){
    var mine=(h===state.handle);var acts='';
    if(state.hostMode){acts='<button class="btn soft sm" data-action="invite" data-h="'+esc(h)+'">Invite</button><button class="btn ghost sm" data-action="dismiss" data-h="'+esc(h)+'">Dismiss</button>';}
    else if(mine){acts='<button class="btn ghost sm" data-action="lower">'+t('lower')+'</button>';}
    return '<div class="hand-row">'+avatar(h,36)+'<span class="hn">'+esc(h)+(mine?' <span class="tagp">You</span>':'')+'</span>'+acts+'</div>';
  }).join('');
}
function renderHostBar(){
  var b=$('#rm-host');b.hidden=!state.hostMode;
  if(!state.hostMode)return;
  b.innerHTML='<span class="eyebrow">Host tools · preview</span><div class="hb-row">'+
    '<button class="btn soft sm" data-action="host-lock" aria-pressed="'+state.locked+'">'+ico('lock',15)+' '+(state.locked?'Unlock room':'Lock room')+'</button>'+
    '<button class="btn soft sm" data-action="host-mute">Mute all</button>'+
    '<button class="btn ghost sm" data-action="host-end">End room</button></div>';
}
function addMsg(h,text,kind){
  var box=$('#rm-chat');if(!box)return;
  var near=(box.scrollHeight-box.scrollTop-box.clientHeight)<80;
  var row=document.createElement('div');
  row.className='msg'+(kind==='me'?' me':'')+(kind==='host'?' host':'');
  row.innerHTML=avatar(h,30)+'<div class="bub"><div class="who">'+esc(h)+(kind==='host'?'<span class="tagp">Host</span>':'')+(kind==='me'?'<span class="tagp">You</span>':'')+'</div><p></p></div>';
  row.querySelector('p').textContent=text;
  box.appendChild(row);
  while(box.children.length>60){box.removeChild(box.firstChild);}
  if(near||kind==='me'){box.scrollTop=box.scrollHeight;}
}
function invite(h){
  if(state.guests.length>=3){toast('Stage is full. Ask someone to step down first.');return;}
  state.hands=state.hands.filter(function(x){return x!==h;});
  var me=(h===state.handle);
  state.guests.push({h:h,me:me});
  if(me){state.hand=false;state.muted=false;}
  renderStage();renderHands();renderDock();
  if(me){toast(state.room.host+' invited you to speak');}
}
function startRoom(r,admitted){
  clearAll();clearTimeout(state.lobbyTimer);
  state.room=r;
  state.guests=(r.guests||[]).map(function(h){return {h:h,me:false};});
  state.hands=['Gentle Suya','Bold Kola'];
  state.hand=false;state.muted=false;state.disguise='Off';state.speaker=r.host;state.hostMode=false;state.locked=false;
  state.count=r.count;state.secs=23*60+41;
  show('room');buildRoom();renderStage();renderDock();renderHands();
  (SEED[r.id]||SEED.bet).forEach(function(m){addMsg(m[0],m[1],m[2]);});
  var box=$('#rm-chat');box.scrollTop=box.scrollHeight;
  state.timers.push(
    setInterval(function(){
      state.secs++;
      var m=String(Math.floor(state.secs/60)).padStart(2,'0'),s=String(state.secs%60).padStart(2,'0');
      var e=$('#rm-time');if(e){e.textContent=m+':'+s;}
    },1000),
    setInterval(function(){
      var ids=[state.room.host].concat(state.guests.filter(function(g){return !g.me;}).map(function(g){return g.h;}));
      state.speaker=(Math.random()<0.45)?state.room.host:pick(ids);
      paintSpeaking();
    },3200),
    setInterval(function(){
      var who=pick(PEOPLE.filter(function(p){return p!==state.handle;}));
      addMsg(who,pick(KIND));
    },7000),
    setInterval(function(){
      state.count=Math.max(10,state.count+Math.floor(Math.random()*5)-2);
      var e=$('#rm-count');if(e){e.textContent=state.count;}
    },5000)
  );
  toast(admitted?'You’re in. Listening quietly.':'You’re in as a listener.');
}
function leaveRoom(msg){
  clearAll();clearTimeout(state.lobbyTimer);
  state.room=null;state.guests=[];state.hand=false;state.hostMode=false;state.locked=false;
  closeSheet();go(state.from||'groups');
  if(msg){toast(msg);}
}

/* ---------- Actions ---------- */
var H={
  lang:function(b){state.lang=b.getAttribute('data-v');renderCurrent();},
  reroll:function(){state.handle=newHandle(state.handle);keep(renderLanding);},
  enter:function(){state.entered=true;go('dash');},
  about:function(){renderLanding();show('landing');},
  nav:function(b){go(b.getAttribute('data-v'));},
  gfilter:function(b){state.filter=b.getAttribute('data-v');keep(renderGroups);},
  tfilter:function(b){state.tfilter=b.getAttribute('data-v');keep(renderTherapy);},
  lfilter:function(b){state.lfilter=b.getAttribute('data-v');keep(renderLibrary);},
  remind:function(b){
    var id=b.getAttribute('data-id');
    if(state.remind[id]){delete state.remind[id];toast('Reminder removed');}else{state.remind[id]=true;toast('We’ll remind you before it starts');}
    keep(renderCurrent);
  },
  join:function(b){state.from=(APP.indexOf(state.screen)>=0)?state.screen:'groups';openRoom(b.getAttribute('data-id'));},
  help:helpSheet,
  closesheet:closeSheet,
  leavelobby:function(){clearTimeout(state.lobbyTimer);go(state.from||'groups');},
  leave:function(){leaveRoom();},
  roommenu:menuSheet,
  'menu-report':function(){closeSheet();toast('Report sent to the host. Thank you.');},
  'menu-help':function(){closeSheet();helpSheet();},
  'menu-qx':quickExit,
  'menu-host':function(){closeSheet();state.hostMode=!state.hostMode;renderHostBar();renderHands();},
  mood:function(b){state.mood=parseInt(b.getAttribute('data-v'),10);keep(renderDash);},
  affirm:function(){var n;do{n=Math.floor(Math.random()*AFFIRM.length);}while(n===state.affirm);state.affirm=n;$('#aff-q').textContent=AFFIRM[n];},
  tool:function(b){stopTool();state.tool=b.getAttribute('data-v');state.ground=0;renderTools();show('tools');},
  toolback:function(){stopTool();state.tool=null;renderTools();$('#s-tools').scrollTop=0;},
  breath:function(){if(state.breath){breathStop(false);}else{breathStart();}},
  'ground-next':function(){state.ground++;renderTools();},
  'ground-back':function(){state.ground=Math.max(0,state.ground-1);renderTools();},
  'ground-reset':function(){state.ground=0;renderTools();},
  'j-prompt':function(){state.prompt=(state.prompt+1)%PROMPTS.length;$('#j-prompt').textContent=PROMPTS[state.prompt];},
  'j-save':function(){
    var v=$('#j-in').value.trim();if(!v){toast('Write a few words first.');return;}
    state.journal.unshift({text:v,when:'Today, '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});
    keep(renderTools);toast('Saved to your journal.');
  },
  'j-del':function(b){state.journal.splice(parseInt(b.getAttribute('data-i'),10),1);keep(renderTools);},
  'qx-toggle':function(){state.qx=!state.qx;$('#qxbar').hidden=!(state.qx&&APP.indexOf(state.screen)>=0);keep(renderTools);toast(state.qx?'Quick-exit bar is on.':'Quick-exit bar is off.');},
  qx:quickExit,
  book:function(b){bookSheet(b.getAttribute('data-id'));},
  slot:function(b){state.book.slot=b.getAttribute('data-v');bookUI();},
  plan:function(b){state.book.plan=b.getAttribute('data-v');bookUI();},
  'confirm-book':function(){
    var bk=state.book;var p=byId(PROS,bk.id);
    state.bookings.push({name:p.name,slot:bk.slot,plan:bk.plan==='one'?'Per session':'Monthly plan'});
    closeSheet();keep(renderTherapy);toast('Booked with '+p.name+'. Prototype: no payment taken.');
  },
  save:function(b){var id=b.getAttribute('data-id');if(state.saved[id]){delete state.saved[id];}else{state.saved[id]=true;toast('Saved to your library.');}keep(renderLibrary);},
  open:function(b){var x=byId(LIB,b.getAttribute('data-id'));openSheet('<h3 class="display">'+esc(x.title)+'</h3><p class="muted">'+esc(x.blurb)+'</p><div class="placeholder">Prototype: the full '+(x.type==='Audio'?'audio':'text')+' opens here.</div><button class="btn primary big" data-action="closesheet">Close</button>');},
  buy:function(b){var x=byId(LIB,b.getAttribute('data-id'));toast('Prototype: '+x.title+' for '+x.price+'. No payment taken.');},
  tab:function(b){
    var v=b.getAttribute('data-v');
    $$('.tab').forEach(function(x){x.setAttribute('aria-selected',String(x.getAttribute('data-v')===v));});
    $('#rm-chat').hidden=(v!=='chat');$('#rm-hands').hidden=(v!=='hands');
  },
  react:function(b){
    var f=document.createElement('span');f.className='floaty';f.textContent=b.getAttribute('data-e');
    f.style.setProperty('--x',(Math.random()*60-30)+'px');
    $('#s-room').appendChild(f);setTimeout(function(){f.remove();},1800);
  },
  raise:function(){
    if(state.hand)return;
    state.hand=true;state.hands.push(state.handle);renderHands();renderDock();
    toast('Hand raised. The host will see it.');
    clearTimeout(state.handTimer);
    state.handTimer=setTimeout(function(){if(state.hand&&!state.hostMode){invite(state.handle);}},3600);
  },
  lower:function(){
    state.hand=false;clearTimeout(state.handTimer);
    state.hands=state.hands.filter(function(h){return h!==state.handle;});
    renderHands();renderDock();
  },
  mic:function(){state.muted=!state.muted;renderDock();paintSpeaking();},
  step:function(){
    state.guests=state.guests.filter(function(g){return !g.me;});
    state.muted=false;state.disguise='Off';
    renderStage();renderDock();toast('You stepped down. Still listening.');
  },
  disguise:function(b){
    state.disguise=b.getAttribute('data-v');renderDock();
    toast(state.disguise==='Off'?'Voice disguise off':'Voice disguise '+state.disguise+' (preview only)');
  },
  invite:function(b){invite(b.getAttribute('data-h'));},
  dismiss:function(b){
    var h=b.getAttribute('data-h');
    state.hands=state.hands.filter(function(x){return x!==h;});
    if(h===state.handle){state.hand=false;}
    renderHands();renderDock();
  },
  'host-lock':function(){
    state.locked=!state.locked;renderHostBar();
    $('#rm-lock').hidden=!state.locked;
    toast(state.locked?'Room locked. No new people can join.':'Room unlocked.');
  },
  'host-mute':function(){state.muted=true;renderDock();paintSpeaking();toast('Everyone on stage is muted.');},
  'host-end':function(){leaveRoom('Room ended (host preview).');}
};
var lastTap=0;
document.addEventListener('click',function(e){
  if(e.target.closest('#cover-title')){
    var now=Date.now();
    if(now-lastTap<450){lastTap=0;show(state.qxPrev||'dash');}else{lastTap=now;}
    return;
  }
  var b=e.target.closest('[data-action]');if(!b)return;
  var a=b.getAttribute('data-action');
  if(H[a]){H[a](b,e);}
});
document.addEventListener('submit',function(e){
  var f=e.target;
  if(f.id==='code-form'){
    e.preventDefault();
    var v=$('#code-in').value.trim().toUpperCase();
    if(v==='SISTER'){
      var id=f.getAttribute('data-room');state.verified[id]=true;closeSheet();
      showLobby(byId(ROOMS,id));
    }else{$('#code-err').hidden=false;}
  }
  if(f.id==='chat-form'){
    e.preventDefault();
    var inp=$('#chat-in');var text=inp.value.trim();if(!text)return;
    if(/(\+?\d[\d\s\-]{6,}\d)|https?:\/\/|www\./i.test(text)){
      toast('Phone numbers and links aren’t allowed in rooms. It keeps everyone safe.');return;
    }
    addMsg(state.handle,text,'me');inp.value='';
    if(Math.random()<0.5){setTimeout(function(){if(state.screen==='room'){addMsg(pick(PEOPLE.filter(function(p){return p!==state.handle;})),pick(KIND));}},2200);}
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();}});

state.handle=newHandle('');
renderLanding();show('landing');
})();
</script>
